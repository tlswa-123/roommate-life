<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#247e70">
  <meta name="description" content="合租生活管家，把费用、值日、公共物品和室友公约，一起安排明白。">
  <title>同住 · 合租生活管家</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css?v=20261011-3">
  <link rel="stylesheet" href="./fun.css?v=20261011-3">
  <link rel="stylesheet" href="./smart-tools.css?v=20261011-3">
  <script src="./app.js?v=20261011-3" defer></script>
  <script src="./lifestyle.js?v=20261011-3" defer></script>
  <script src="./smart-tools.js?v=20261011-3" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/><path d="M9 7h6"/></symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="icon-wallet" viewBox="0 0 24 24"><path d="M20 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h15V8H5a3 3 0 0 1 0-6"/><path d="M20 11h-5v6h5"/><path d="M17 14h.01"/></symbol>
    <symbol id="icon-sparkles" viewBox="0 0 24 24"><path d="m12 3 2.7 6.3L21 12l-6.3 2.7L12 21l-2.7-6.3L3 12l6.3-2.7Z"/><path d="m20 3 .4 1.6L22 5l-1.6.4L20 7l-.4-1.6L18 5l1.6-.4Z"/></symbol>
    <symbol id="icon-box" viewBox="0 0 24 24"><path d="m3 7 9-4 9 4v10l-9 4-9-4Z"/><path d="m3 7 9 4 9-4M12 11v10M7.5 5l9 4"/></symbol>
    <symbol id="icon-note" viewBox="0 0 24 24"><path d="M14 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V10Z"/><path d="M14 3v7h7M7 14h10M7 17h7"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="icon-users" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 4v2"/></symbol>
    <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2.6 7M3 4v7h7"/></symbol>
    <symbol id="icon-leaf" viewBox="0 0 24 24"><path d="M20 3c-9 0-16 3-16 10a7 7 0 0 0 7 7c7 0 9-8 9-17Z"/><path d="M4 20 15 9"/></symbol>
    <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
  </svg>

  <div class="app-layout">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#icon-home"></use></svg></span>
        <div><span class="brand-name">同住<span class="brand-dot">.</span></span><span class="brand-tagline">把日子，一起过好</span></div>
      </div>

      <div class="house-card">
        <div class="house-icon"><svg class="icon" aria-hidden="true"><use href="#icon-home"></use></svg></div>
        <div><strong>梧桐里 302</strong><span><i class="status-dot"></i>4 位室友的共同小家</span></div>
      </div>

      <p class="nav-caption">我们的生活</p>
      <nav class="side-nav">
        <button type="button" data-view="overview" class="nav-button active" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#icon-grid"></use></svg><span>生活总览</span></button>
        <button type="button" data-view="expenses" class="nav-button"><svg class="icon" aria-hidden="true"><use href="#icon-wallet"></use></svg><span>费用分摊</span></button>
        <button type="button" data-view="chores" class="nav-button"><svg class="icon" aria-hidden="true"><use href="#icon-sparkles"></use></svg><span>清洁值日</span></button>
        <button type="button" data-view="supplies" class="nav-button"><svg class="icon" aria-hidden="true"><use href="#icon-box"></use></svg><span>公共物品</span></button>
        <button type="button" data-view="life" class="nav-button"><svg class="icon" aria-hidden="true"><use href="#icon-heart"></use></svg><span>室友空间</span></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="home-note"><svg class="icon" aria-hidden="true"><use href="#icon-leaf"></use></svg><p>分工清楚，账目透明。<br><strong>给共同生活多一点轻松。</strong></p></div>
        <div class="roommates-small" aria-label="室友小林、阿哲、小雨、可可"><span class="avatar avatar-m1">林</span><span class="avatar avatar-m2">哲</span><span class="avatar avatar-m3">雨</span><span class="avatar avatar-m4">可</span><span class="roommate-count">一起住，一起管</span></div>
        <button type="button" id="reset-demo" data-action="reset" class="reset-button"><svg class="icon" aria-hidden="true"><use href="#icon-reset"></use></svg>重置演示数据</button>
        <p class="demo-caption">体验版 · 数据保存在当前浏览器</p>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-context"><span class="status-dot"></span>共享生活空间<span class="topbar-divider">/</span><strong>梧桐里 302</strong></div>
        <label class="member-selector" for="member-switch"><span>当前室友</span><select id="member-switch" aria-label="切换当前室友"><option value="m1">小林</option><option value="m2">阿哲</option><option value="m3">小雨</option><option value="m4">可可</option></select></label>
      </header>
      <div class="main-shell">
        <div class="page-heading">
          <div><div class="eyebrow">LESS FRICTION, MORE LIVING</div><h1 id="page-title">生活总览</h1><p id="page-subtitle">账目有数，分工有序，小事也能好好商量。</p></div>
          <button id="primary-action" type="button" class="btn btn-primary"><svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg><span>记一笔费用</span></button>
        </div>
        <main id="main-content" tabindex="-1" aria-label="合租管理内容"><div class="loading-state"><span class="loading-dot"></span>正在整理我们的小家…</div></main>
        <footer class="page-footer"><span>同住 · 让合租生活井井有条</span><span>共同记录，也共同决定</span></footer>
      </div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>
</body>
</html>
